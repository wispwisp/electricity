<!-- Generic double wall socket: a plate with two round earthed outlets. Terminals on the top edge,
     left to right: L (brown), N (blue), PE (yellow-green). -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny"
     width="54" height="27" viewBox="0 0 54 27">
  <rect x="0.75" y="0.75" width="52.5" height="25.5" rx="3.5"
        fill="#9ba2aa" stroke="#e6e8eb" stroke-width="1.5"/>
  <!-- Outlets: a round recess with two pin holes -->
  <circle cx="13.5" cy="19.75" r="5.75" fill="#5a6069" stroke="#e6e8eb" stroke-width="1"/>
  <circle cx="11" cy="19.75" r="1.2" fill="#1c1e21"/>
  <circle cx="16" cy="19.75" r="1.2" fill="#1c1e21"/>
  <circle cx="40.5" cy="19.75" r="5.75" fill="#5a6069" stroke="#e6e8eb" stroke-width="1"/>
  <circle cx="38" cy="19.75" r="1.2" fill="#1c1e21"/>
  <circle cx="43" cy="19.75" r="1.2" fill="#1c1e21"/>
  <g id="terminal-L">
    <circle cx="13.5" cy="4.5" r="3" fill="#c3c7cc" stroke="#2a2c30" stroke-width="0.6"/>
    <line x1="11.7" y1="6.3" x2="15.3" y2="2.7" stroke="#2a2c30" stroke-width="0.9"/>
    <rect x="10" y="9" width="7" height="4" rx="0.8" fill="#8a4b24" stroke="#1c1e21"
          stroke-width="0.6"/>
  </g>
  <g id="terminal-N">
    <circle cx="27" cy="4.5" r="3" fill="#c3c7cc" stroke="#2a2c30" stroke-width="0.6"/>
    <line x1="25.2" y1="6.3" x2="28.8" y2="2.7" stroke="#2a2c30" stroke-width="0.9"/>
    <rect x="23.5" y="9" width="7" height="4" rx="0.8" fill="#2f6fd0" stroke="#1c1e21"
          stroke-width="0.6"/>
  </g>
  <g id="terminal-PE">
    <circle cx="40.5" cy="4.5" r="3" fill="#c3c7cc" stroke="#2a2c30" stroke-width="0.6"/>
    <line x1="38.7" y1="6.3" x2="42.3" y2="2.7" stroke="#2a2c30" stroke-width="0.9"/>
    <rect x="37" y="9" width="7" height="4" rx="0.8" fill="#2e9a46"/>
    <polygon points="37.5,13 39,13 41.5,9 40,9" fill="#e8cf2e"/>
    <polygon points="41,13 42.5,13 44,10.6 44,9 43.5,9" fill="#e8cf2e"/>
    <rect x="37" y="9" width="7" height="4" rx="0.8" fill="none" stroke="#1c1e21"
          stroke-width="0.6"/>
  </g>
</svg>
