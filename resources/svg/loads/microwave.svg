<!-- Generic microwave oven: a box with a door window on the left and a dial strip on the right. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny"
     width="36" height="36" viewBox="0 0 36 36">
  <!-- Feet -->
  <rect x="4" y="28.5" width="4" height="3" fill="#5a6069"/>
  <rect x="28" y="28.5" width="4" height="3" fill="#5a6069"/>
  <rect x="0.75" y="6.75" width="34.5" height="22.5" rx="2"
        fill="#9ba2aa" stroke="#e6e8eb" stroke-width="1.5"/>
  <!-- Door window -->
  <rect x="3.5" y="9.5" width="20.5" height="17" rx="1.2" fill="#3b4047"/>
  <rect x="5.5" y="11.5" width="16.5" height="13" rx="0.8" fill="#5a6069"/>
  <!-- Dial strip -->
  <line x1="26" y1="7.5" x2="26" y2="28.5" stroke="#3b4047" stroke-width="1"/>
  <circle cx="30.5" cy="13.5" r="2.5" fill="#3b4047"/>
  <circle cx="30.5" cy="21.5" r="2.5" fill="#3b4047"/>
</svg>
