<!-- Generic round ceiling lamp: a glowing dome under its ceiling box. Terminals on the top edge,
     left to right: L (brown), N (blue), PE (yellow-green). -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny"
     width="36" height="36" viewBox="0 0 36 36">
  <!-- Ceiling box holding the terminals -->
  <rect x="3" y="0.75" width="30" height="13.5" rx="1.5"
        fill="#d2d5d9" stroke="#1c1e21" stroke-width="1.2"/>
  <!-- Fixture base and glowing diffuser -->
  <rect x="5.25" y="15.75" width="25.5" height="3.5" rx="1.2"
        fill="#9ba2aa" stroke="#e6e8eb" stroke-width="1.2"/>
  <path d="M 6.5,19.5 H 29.5 A 11.5,8.5 0 0 1 6.5,19.5 Z"
        fill="#f0c24a" stroke="#e6e8eb" stroke-width="1.2"/>
  <!-- Light rays -->
  <line x1="18" y1="30.5" x2="18" y2="34.5" stroke="#f0c24a" stroke-width="1.8"
        stroke-linecap="round"/>
  <line x1="9.5" y1="28" x2="6" y2="31.5" stroke="#f0c24a" stroke-width="1.8"
        stroke-linecap="round"/>
  <line x1="26.5" y1="28" x2="30" y2="31.5" stroke="#f0c24a" stroke-width="1.8"
        stroke-linecap="round"/>
  <g id="terminal-L">
    <circle cx="9" cy="4.5" r="3" fill="#c3c7cc" stroke="#2a2c30" stroke-width="0.6"/>
    <line x1="7.2" y1="6.3" x2="10.8" y2="2.7" stroke="#2a2c30" stroke-width="0.9"/>
    <rect x="5.5" y="9" width="7" height="4" rx="0.8" fill="#8a4b24" stroke="#1c1e21"
          stroke-width="0.6"/>
  </g>
  <g id="terminal-N">
    <circle cx="18" cy="4.5" r="3" fill="#c3c7cc" stroke="#2a2c30" stroke-width="0.6"/>
    <line x1="16.2" y1="6.3" x2="19.8" y2="2.7" stroke="#2a2c30" stroke-width="0.9"/>
    <rect x="14.5" y="9" width="7" height="4" rx="0.8" fill="#2f6fd0" stroke="#1c1e21"
          stroke-width="0.6"/>
  </g>
  <g id="terminal-PE">
    <circle cx="27" cy="4.5" r="3" fill="#c3c7cc" stroke="#2a2c30" stroke-width="0.6"/>
    <line x1="25.2" y1="6.3" x2="28.8" y2="2.7" stroke="#2a2c30" stroke-width="0.9"/>
    <rect x="23.5" y="9" width="7" height="4" rx="0.8" fill="#2e9a46"/>
    <polygon points="24,13 25.5,13 28,9 26.5,9" fill="#e8cf2e"/>
    <polygon points="27.5,13 29,13 30.5,10.6 30.5,9 30,9" fill="#e8cf2e"/>
    <rect x="23.5" y="9" width="7" height="4" rx="0.8" fill="none" stroke="#1c1e21"
          stroke-width="0.6"/>
  </g>
</svg>
