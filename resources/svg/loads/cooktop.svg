<!-- Generic electric cooktop seen from above: a hob with four rings. Terminals on the top edge,
     left to right: L (brown), N (blue), PE (yellow-green). -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny"
     width="54" height="36" viewBox="0 0 54 36">
  <rect x="0.75" y="0.75" width="52.5" height="34.5" rx="3"
        fill="#4a4f57" stroke="#e6e8eb" stroke-width="1.5"/>
  <!-- Rings: two small at the back, two large at the front -->
  <circle cx="8.25" cy="10.5" r="5.25" fill="#33373d" stroke="#d9603b" stroke-width="1.4"/>
  <circle cx="8.25" cy="10.5" r="2.5" fill="none" stroke="#d9603b" stroke-width="1"/>
  <circle cx="45.75" cy="10.5" r="5.25" fill="#33373d" stroke="#d9603b" stroke-width="1.4"/>
  <circle cx="45.75" cy="10.5" r="2.5" fill="none" stroke="#d9603b" stroke-width="1"/>
  <circle cx="12.5" cy="25.5" r="7.5" fill="#33373d" stroke="#d9603b" stroke-width="1.4"/>
  <circle cx="12.5" cy="25.5" r="3.75" fill="none" stroke="#d9603b" stroke-width="1"/>
  <circle cx="41.5" cy="25.5" r="7.5" fill="#33373d" stroke="#d9603b" stroke-width="1.4"/>
  <circle cx="41.5" cy="25.5" r="3.75" fill="none" stroke="#d9603b" stroke-width="1"/>
  <!-- Touch controls -->
  <circle cx="23" cy="29" r="1.3" fill="#c3c7cc"/>
  <circle cx="27" cy="29" r="1.3" fill="#c3c7cc"/>
  <circle cx="31" cy="29" r="1.3" fill="#c3c7cc"/>
  <g id="terminal-L">
    <circle cx="18" cy="4.5" r="3" fill="#c3c7cc" stroke="#2a2c30" stroke-width="0.6"/>
    <line x1="16.2" y1="6.3" x2="19.8" y2="2.7" stroke="#2a2c30" stroke-width="0.9"/>
    <rect x="14.5" y="9" width="7" height="4" rx="0.8" fill="#8a4b24" stroke="#1c1e21"
          stroke-width="0.6"/>
  </g>
  <g id="terminal-N">
    <circle cx="27" cy="4.5" r="3" fill="#c3c7cc" stroke="#2a2c30" stroke-width="0.6"/>
    <line x1="25.2" y1="6.3" x2="28.8" y2="2.7" stroke="#2a2c30" stroke-width="0.9"/>
    <rect x="23.5" y="9" width="7" height="4" rx="0.8" fill="#2f6fd0" stroke="#1c1e21"
          stroke-width="0.6"/>
  </g>
  <g id="terminal-PE">
    <circle cx="36" cy="4.5" r="3" fill="#c3c7cc" stroke="#2a2c30" stroke-width="0.6"/>
    <line x1="34.2" y1="6.3" x2="37.8" y2="2.7" stroke="#2a2c30" stroke-width="0.9"/>
    <rect x="32.5" y="9" width="7" height="4" rx="0.8" fill="#2e9a46"/>
    <polygon points="33,13 34.5,13 37,9 35.5,9" fill="#e8cf2e"/>
    <polygon points="36.5,13 38,13 39.5,10.6 39.5,9 39,9" fill="#e8cf2e"/>
    <rect x="32.5" y="9" width="7" height="4" rx="0.8" fill="none" stroke="#1c1e21"
          stroke-width="0.6"/>
  </g>
</svg>
