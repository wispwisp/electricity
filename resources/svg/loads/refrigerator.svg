<!-- Generic two-door refrigerator: a tall body, fridge door above, freezer door below. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny"
     width="36" height="36" viewBox="0 0 36 36">
  <rect x="9.25" y="0.75" width="17.5" height="34.5" rx="2"
        fill="#9ba2aa" stroke="#e6e8eb" stroke-width="1.5"/>
  <line x1="10" y1="22.5" x2="26" y2="22.5" stroke="#3b4047" stroke-width="1.2"/>
  <!-- Door handles -->
  <line x1="12.5" y1="14" x2="12.5" y2="20" stroke="#3b4047" stroke-width="1.8"
        stroke-linecap="round"/>
  <line x1="12.5" y1="25" x2="12.5" y2="30" stroke="#3b4047" stroke-width="1.8"
        stroke-linecap="round"/>
</svg>
