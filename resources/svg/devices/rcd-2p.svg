<!-- Generic 2-pole residual current device, 2 modules. One wide handle, drawn on (up). -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny"
     width="36" height="90" viewBox="0 0 36 90">
  <g id="body">
    <rect x="1" y="1" width="34" height="88" rx="1.5"
          fill="#d2d5d9" stroke="#1c1e21" stroke-width="2"/>
    <!-- Raised front with the handle and the test button -->
    <rect x="2" y="22" width="32" height="46" fill="#e8eaed"/>
    <line x1="2" y1="22" x2="34" y2="22" stroke="#9a9fa5" stroke-width="0.75"/>
    <line x1="2" y1="68" x2="34" y2="68" stroke="#9a9fa5" stroke-width="0.75"/>
    <rect id="label" x="3" y="25" width="19" height="7" rx="0.5"
          fill="#ffffff" stroke="#8c9197" stroke-width="0.5"/>
    <g id="test-button">
      <circle cx="28.5" cy="28.5" r="4.5" fill="#e3b23c" stroke="#1c1e21" stroke-width="0.8"/>
      <circle cx="28.5" cy="28.5" r="2.5" fill="none" stroke="#b5862a" stroke-width="0.6"/>
    </g>
    <rect x="10" y="36" width="16" height="26" rx="1"
          fill="#80858b" stroke="#1c1e21" stroke-width="0.6"/>
    <!-- Terminal openings with screws -->
    <rect x="4" y="3" width="10" height="10" rx="1"
          fill="#5b6066" stroke="#1c1e21" stroke-width="0.5"/>
    <rect x="22" y="3" width="10" height="10" rx="1"
          fill="#5b6066" stroke="#1c1e21" stroke-width="0.5"/>
    <rect x="4" y="77" width="10" height="10" rx="1"
          fill="#5b6066" stroke="#1c1e21" stroke-width="0.5"/>
    <rect x="22" y="77" width="10" height="10" rx="1"
          fill="#5b6066" stroke="#1c1e21" stroke-width="0.5"/>
    <g id="terminal-1">
      <circle cx="9" cy="8" r="3.6" fill="#c3c7cc" stroke="#2a2c30" stroke-width="0.6"/>
      <line x1="6.8" y1="10.2" x2="11.2" y2="5.8" stroke="#2a2c30" stroke-width="1"/>
    </g>
    <g id="terminal-N1">
      <circle cx="27" cy="8" r="3.6" fill="#c3c7cc" stroke="#2a2c30" stroke-width="0.6"/>
      <line x1="24.8" y1="10.2" x2="29.2" y2="5.8" stroke="#2a2c30" stroke-width="1"/>
    </g>
    <g id="terminal-2">
      <circle cx="9" cy="82" r="3.6" fill="#c3c7cc" stroke="#2a2c30" stroke-width="0.6"/>
      <line x1="6.8" y1="84.2" x2="11.2" y2="79.8" stroke="#2a2c30" stroke-width="1"/>
    </g>
    <g id="terminal-N2">
      <circle cx="27" cy="82" r="3.6" fill="#c3c7cc" stroke="#2a2c30" stroke-width="0.6"/>
      <line x1="24.8" y1="84.2" x2="29.2" y2="79.8" stroke="#2a2c30" stroke-width="1"/>
    </g>
  </g>
  <g id="handle">
    <rect x="10.5" y="36.5" width="15" height="13" rx="1"
          fill="#2b2d31" stroke="#0f1012" stroke-width="0.5"/>
    <line x1="12" y1="39.5" x2="24" y2="39.5" stroke="#55595f" stroke-width="0.6"/>
    <line x1="12" y1="41.5" x2="24" y2="41.5" stroke="#55595f" stroke-width="0.6"/>
  </g>
</svg>
